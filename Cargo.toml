[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Artur Zielazny"]
repository = "https://github.com/arturzielazny/atc-thermo"
homepage = "https://arturzielazny.github.io/atc-thermo/"

[workspace.dependencies]
atc = { path = "crates/atc" }
bthome = { path = "crates/bthome" }
calibration = { path = "crates/calibration" }
bluer = { version = "0.17.4", features = ["bluetoothd"] }
futures = "0.3.34"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_precision_loss = "allow"
